<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Light/Sky Blue Gradient for Skyscrapers and B-Shape -->
    <linearGradient id="skyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565c0" />
      <stop offset="30%" stop-color="#1e88e5" />
      <stop offset="70%" stop-color="#42a5f5" />
      <stop offset="100%" stop-color="#90caf9" />
    </linearGradient>

    <!-- Dark Blue Gradient for the A-Frame Roof and Main Text -->
    <linearGradient id="darkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0a1d37" />
      <stop offset="100%" stop-color="#1c3b68" />
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. Background Skyscraper Cluster (Light Blue Gradient) -->
  <g id="skyscrapers" opacity="0.85">
    <!-- Left Building Cluster -->
    <!-- Building 1 (Far Left) -->
    <path d="M 130,280 L 130,170 L 155,145 L 155,280 Z" fill="url(#skyGrad)" />
    <line x1="142" y1="160" x2="142" y2="280" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

    <!-- Building 2 (Left Center) -->
    <path d="M 160,280 L 160,110 L 190,80 L 190,280 Z" fill="url(#skyGrad)" />
    <line x1="170" y1="100" x2="170" y2="280" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
    <line x1="180" y1="100" x2="180" y2="280" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

    <!-- Building 3 (Center Left) -->
    <path d="M 195,280 L 195,140 L 220,115 L 220,280 Z" fill="url(#skyGrad)" />
    <line x1="207" y1="130" x2="207" y2="280" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

    <!-- Right Building Cluster -->
    <!-- Building 4 (Center Right) -->
    <path d="M 235,280 L 235,120 L 265,90 L 265,280 Z" fill="url(#skyGrad)" />
    <line x1="245" y1="110" x2="245" y2="280" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
    <line x1="255" y1="110" x2="255" y2="280" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

    <!-- Building 5 (Right Center) -->
    <path d="M 270,280 L 270,150 L 295,125 L 295,280 Z" fill="url(#skyGrad)" />
    <line x1="282" y1="140" x2="282" y2="280" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

    <!-- Building 6 (Far Right) -->
    <path d="M 300,280 L 300,180 L 325,155 L 325,280 Z" fill="url(#skyGrad)" />
    <line x1="312" y1="170" x2="312" y2="280" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- 2. Arched House Window (Bright Blue) -->
  <g id="window" fill="url(#skyGrad)" filter="url(#shadow)">
    <!-- Top-Left Pane (Arched) -->
    <path d="M 202,280 L 202,250 C 202,238 211,232 222,232 L 222,280 Z" />
    <!-- Top-Right Pane (Arched) -->
    <path d="M 228,280 L 228,232 C 239,232 248,238 248,250 L 248,280 Z" />
    <!-- Bottom-Left Pane (Rectangular) -->
    <rect x="202" y="285" width="20" height="25" />
    <!-- Bottom-Right Pane (Rectangular) -->
    <rect x="228" y="285" width="20" height="25" />
  </g>

  <!-- 3. A-Frame Roof / Chevron (Dark Blue) -->
  <path id="roof" d="M 90,320 L 225,160 L 360,320 L 325,320 L 225,200 L 125,320 Z" fill="url(#darkGrad)" filter="url(#shadow)" />

  <!-- 4. "B" Shape (Sky Blue, Integrated and Slanted parallel to roof leg) -->
  <!-- Slanted and placed on the right side of the roof -->
  <g id="b-shape" transform="translate(250, 168) rotate(49.2)" filter="url(#shadow)">
    <!-- Custom drawn B with inner cutouts -->
    <path d="M 0,-4 L 75,-4 C 115,-4 135,10 135,35 C 135,55 120,68 95,72 C 125,76 140,92 140,118 C 140,148 110,162 70,162 L 0,162 Z
             M 25,20 L 65,20 C 80,20 95,25 95,42 C 95,58 80,62 65,62 L 25,62 Z
             M 25,86 L 68,86 C 85,86 100,92 100,112 C 100,132 85,138 68,138 L 25,138 Z"
          fill="url(#skyGrad)" fill-rule="evenodd" />
  </g>

  <text x="250" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0a1d37" letter-spacing="1.6">ARYADI BUSINESS PVT.LTD.</text>
</svg>
